# Python package `niimblue` (ctypes bindings in bindings/python). Building it
# compiles libniimblue with CMake and puts the shared library into the wheel:
#
#   pip install path/to/niimbluelib/native
#   pip install "niimblue @ git+<repo url>#subdirectory=native"
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "niimblue"
version = "0.1.0"
description = "NIIMBOT label printers from Python: niimbluelib compiled into a native library (ctypes bindings)"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
cmake.build-type = "Release"
build-dir = "build/python/{wheel_tag}"
# ctypes, no Python C API: one wheel per platform for every Python 3
wheel.py-api = "py3"
wheel.packages = ["bindings/python/niimblue"]
sdist.exclude = [
    "node_modules", "build", "bindings/kotlin", "bindings/rust/target",
    "examples", "js", "test/*.mjs", "test/*.ts", "go", "*.test",
]

[tool.scikit-build.cmake.define]
NIIM_BUILD_SHARED = "ON"
NIIM_BUILD_STATIC = "OFF"
NIIM_BUILD_TESTS = "OFF"
